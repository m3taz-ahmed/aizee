name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy runtime memory aizee_mcp aizee_cli.py config.py dashboard/server.py eval/harness.py eval/pipeline.py eval/reliability.py eval/redteam.py scripts/guard_invariants.py scripts/sync_docs.py
      - name: pip-audit (supply chain)
        run: |
          python -m pip install "pip-audit==2.7.0" "setuptools>=84.1.0"
          python -m pip_audit --desc
      - name: Test with coverage
        run: python -m pytest -q --cov-fail-under=100
      - name: Validate globals
        run: python scripts/validate-globals.py
      - name: Docs sync check (counts + workflow table)
        run: python scripts/sync_docs.py --check
      - name: Docs guard — API.md exists
        run: |
          if [ ! -f aizee_mcp/API.md ]; then
            echo "::error::aizee_mcp/API.md is missing"
            exit 1
          fi
      - name: Docs guard — LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE is missing"
            exit 1
          fi
      - name: Docs guard — CODEOWNERS exists
        run: |
          if [ ! -f .github/CODEOWNERS ]; then
            echo "::error::.github/CODEOWNERS is missing"
            exit 1
          fi

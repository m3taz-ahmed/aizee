name: aiZee Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run pip-audit
        run: |
          python -m pip install "pip-audit==2.7.0" "setuptools>=84.1.0"
          python -m pip_audit --desc
      - name: Run bandit
        run: |
          python -m pip install bandit==1.7.10
          bandit -r runtime memory aizee_mcp dashboard aizee_cli.py config.py scripts eval -c .bandit -f json -o bandit-report.json
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: aiZee security scan
        run: python aizee_cli.py security scan . --json > aizee-scan.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: security-report
          path: |
            bandit-report.json
            aizee-scan.json

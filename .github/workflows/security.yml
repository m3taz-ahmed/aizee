name: aiZee Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run pip-audit
        run: |
          python -m pip install "pip-audit==2.7.0" "setuptools>=84.1.0"
          python -m pip_audit --desc
      - name: Run bandit
        # Advisory: findings go into the security-report artifact; the
        # enforcing gate is `aizee security scan` below (severity-gated).
        # `.bandit` cannot skip B608 — the test fails to load on py3.14
        # and erroring the whole scan is worse than reporting it.
        run: |
          python -m pip install bandit==1.7.10
          bandit -r runtime memory aizee_mcp dashboard aizee_cli.py config.py scripts eval -c .bandit -f json -o bandit-report.json || true
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: aiZee security scan
        run: python aizee_cli.py security scan . --json > aizee-scan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-report
          path: |
            bandit-report.json
            aizee-scan.json

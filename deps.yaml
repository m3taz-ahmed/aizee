# aiZee external dependency manifest.
#
# Declares software that aiZee FEATURES need but that lives outside this repo:
# binaries, pip packages, git-cloned media kits/apps, docker images, env keys.
#
# Consumed by:
#   - `aizee deps check|install`   (CLI: report + fix)
#   - `aizee doctor`               (folded into health report)
#   - `scripts/update.py`          (post-install hook: offers to install missing)
#
# Add an entry here whenever a skill/workflow/plugin starts needing external
# software — never let a feature ship with silent missing requirements.
#
# Schema per dep:
#   id           unique slug (used by `aizee deps install <id>`)
#   name         display name (defaults to id)
#   kind         binary | pip | git-repo | docker-daemon | docker-image | env | any-path
#   severity     required | recommended | optional   (drives doctor verdict)
#   required_by  free-form list of features/skills that need it (reported to the user)
#   tags         grouping labels (e.g. video) for `aizee deps check --tag`
#
# kind-specific fields:
#   binary        bin, version_cmd, version_regex, min_version
#   pip           package, min_version
#   git-repo      path, repo          (install = git clone --depth 1, update = git pull)
#   docker-daemon (no fields — runs `docker info`)
#   docker-image  image, install.all  (build command)
#   env           env_vars, env_any_of
#   any-path      paths               (any one existing = ok)
#
# Commands in install:/update: are per-OS keys (windows|linux|darwin) or `all`.
# Placeholders expanded before running: {media} {root} {python} {path} {repo}
# {image} {package} {bin} {user_profile}
version: 1

media_dir_env: AIZEE_MEDIA_DIR
media_dir_default: "~/.aizee/media"

deps:
  # ---------- core toolchain ----------
  - id: git
    name: Git
    kind: binary
    bin: git
    version_cmd: ["git", "--version"]
    version_regex: '(\d+\.\d+\.\d+)'
    severity: required
    required_by: [core]
    install:
      windows: winget install -e --id Git.Git --accept-source-agreements --accept-package-agreements
      darwin: brew install git
      linux: sudo apt-get install -y git
    update:
      windows: winget upgrade -e --id Git.Git --accept-source-agreements --accept-package-agreements
      darwin: brew upgrade git
      linux: sudo apt-get install -y git

  - id: python
    name: Python
    kind: binary
    bin: python
    version_cmd: ["python", "--version"]
    version_regex: '(\d+\.\d+\.\d+)'
    min_version: "3.9"
    severity: required
    required_by: [core]
    guidance: Install Python 3.11+ from https://www.python.org/downloads/ (tick "Add to PATH")

  - id: node
    name: Node.js
    kind: binary
    bin: node
    version_cmd: ["node", "--version"]
    version_regex: 'v?(\d+\.\d+\.\d+)'
    min_version: "22.0"
    severity: recommended
    required_by: [cinecode, bang-motion, motion-graphics, hyperframes]
    tags: [video]
    install:
      windows: winget install -e --id OpenJS.NodeJS.LTS --accept-source-agreements --accept-package-agreements
      darwin: brew install node@22
      linux: curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo apt-get install -y nodejs
    update:
      windows: winget upgrade -e --id OpenJS.NodeJS.LTS --accept-source-agreements --accept-package-agreements
      darwin: brew upgrade node@22

  - id: ffmpeg
    name: FFmpeg
    kind: binary
    bin: ffmpeg
    version_cmd: ["ffmpeg", "-version"]
    version_regex: 'ffmpeg version n?(\d+\.\d+)'
    min_version: "6.0"
    severity: recommended
    required_by: ["video-produce (CINECODE/BANG-MOTION/MOTION-*/HYPERFRAMES/EDIT)"]
    tags: [video]
    install:
      windows: winget install -e --id Gyan.FFmpeg --accept-source-agreements --accept-package-agreements
      darwin: brew install ffmpeg
      linux: sudo apt-get install -y ffmpeg
    update:
      windows: winget upgrade -e --id Gyan.FFmpeg --accept-source-agreements --accept-package-agreements
      darwin: brew upgrade ffmpeg
      linux: sudo apt-get install -y ffmpeg

  # ---------- optional runtimes ----------
  - id: docker-cli
    name: Docker CLI
    kind: binary
    bin: docker
    version_cmd: ["docker", "--version"]
    version_regex: '(\d+\.\d+\.\d+)'
    severity: optional
    required_by: [code2video]
    tags: [video]
    guidance: Install Docker Desktop — https://www.docker.com/products/docker-desktop/

  - id: docker-daemon
    name: Docker daemon running
    kind: docker-daemon
    severity: optional
    required_by: [code2video]
    tags: [video]
    guidance: Start Docker Desktop and wait for the engine to come up

  - id: bun
    name: Bun
    kind: binary
    bin: bun
    version_cmd: ["bun", "--version"]
    version_regex: '(\d+\.\d+\.\d+)'
    severity: optional
    required_by: ["motion-graphics engine (template/)"]
    tags: [video]
    install:
      all: npm i -g bun

  - id: hyperframes
    name: hyperframes CLI
    kind: binary
    bin: hyperframes
    version_cmd: ["hyperframes", "--version"]
    version_regex: '(\d+\.\d+\.\d+)'
    severity: recommended
    required_by: ["video-produce (HYPERFRAMES path)"]
    tags: [video]
    install:
      all: npm i -g hyperframes
    update:
      all: npm i -g hyperframes@latest

  - id: playwright
    name: Playwright (+Chromium)
    kind: pip
    package: playwright
    severity: recommended
    required_by: ["motion-design kit (render_template.py)"]
    tags: [video]
    install:
      all: "{python} -m pip install --user playwright && {python} -m playwright install chromium"
    guidance: Browsers install via `{python} -m playwright install chromium` (bundled in the install command)

  - id: faster-whisper
    name: faster-whisper
    kind: pip
    package: faster-whisper
    severity: optional
    required_by: ["video-produce EDIT path (transcripts/captions)"]
    tags: [video]
    install:
      all: "{python} -m pip install --user faster-whisper"

  - id: edge-tts
    name: edge-tts
    kind: pip
    package: edge-tts
    severity: optional
    required_by: [MoneyPrinterTurbo (free TTS)]
    tags: [video]
    install:
      all: "{python} -m pip install --user edge-tts"

  # ---------- media kits (cloned outside the repo) ----------
  - id: kit-cinecode
    name: cinecode kit
    kind: git-repo
    path: "{media}/kits/cinecode"
    repo: https://github.com/sarpstar/cinecode

    kind: binary
    bin: yt-dlp
    version_cmd: ["yt-dlp", "--version"]
    severity: recommended
    required_by: ["video-produce (stock footage / reference download)", "OpenMontage-style corpus paths"]
    tags: [video, media]
    install:

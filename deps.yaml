      windows: scoop install mise
      darwin: brew install mise
      linux: curl https://mise.run | sh
    guidance: >-
      After install run `mise use -g fd bat zoxide fzf lazygit just git-cliff
      biome hyperfine`, then add `mise activate` to your shell profile so the
      tools resolve on PATH.

  - id: devx-cli-suite
    name: DevX CLI suite via mise (fd/bat/zoxide/fzf/lazygit/just/git-cliff/biome/hyperfine)
    kind: command
    check_cmd:
      all: ["mise", "ls", "--global", "--no-header"]
    expect_regex: "zoxide"
    severity: optional
    required_by: ["terminal productivity — fuzzy find, smart cd, fast cat, lazygit TUI, command runner, changelog gen, lint/format, benchmarking"]
    tags: [devx]
    guidance: Run `mise use -g fd bat zoxide fzf lazygit just git-cliff biome hyperfine`


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aizee"
version = "6.5.0"
description = "aiZee — sovereign AI engineering control plane"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Moataz Ahmed"}
]
keywords = ["ai", "agents", "mcp", "workflow", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "mcp>=2.0,<3.0",
    "turbovec>=1.0,<2.0",
    "numpy>=1.24,<3.0",
    "pydantic>=2.0,<3.0",
    "rich>=15.0,<16.0",
    "cryptography>=42.0,<52.0",
    "psutil>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-timeout>=2.0,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=2.0,<3.0",
    "types-pyyaml",
    "types-psutil",
    "sentry-sdk>=2.0,<3.0",
    "defusedxml>=0.7,<0.8",
    "graphifyy>=0.8.20,<0.10.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.0,<3.0",
]
graphify = [
    "graphifyy>=0.8.20,<0.10.0",
]
vector = [
    "sentence-transformers>=6.0,<7.0",
]

[project.scripts]
aizee = "aizee_cli:main"

[tool.setuptools]
py-modules = ["aizee_cli", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "memory*", "aizee_mcp*", "plugins*", "eval*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "tmp",
    "scratch",
    "brain",
    "state",
    "temp",
    "__pycache__",
    ".git",
    ".github",
    "scripts/ui-ux-pro-max",
    "skills/gsap-animated-frontend",
    "tmp/**",
    "scratch/**",
    "temp/**",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"
]
ignore = ["E501", "UP042", "UP046", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SIM117", "E701", "RUF043", "B017", "SIM102", "RUF001", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "skills/", "tmp/", "scratch/", "temp/", "brain/", "state/", "backups/",
    "__pycache__/", "\\.git/", "\\.github/",
    "scripts/ui-ux-pro-max/",
]
[[tool.mypy.overrides]]
module = ["yaml", "sentence_transformers", "turbovec", "numpy", "psutil", "sentry_sdk", "defusedxml", "defusedxml.ElementTree"]
ignore_missing_imports = true

# Test files: included in type checking but with relaxed strictness.
# Tests use mocks, fixtures, and dynamic attributes that don't fit strict typing.
[[tool.mypy.overrides]]
module = ["tests.*", "runtime.tests.*", "memory.tests.*", "aizee_mcp.tests.*", "eval.tests.*"]
strict = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = false
allow_untyped_defs = true
allow_incomplete_defs = true
disable_error_code = ["union-attr", "attr-defined", "method-assign", "comparison-overlap", "type-arg", "assignment", "misc", "var-annotated", "func-returns-value", "arg-type"]

# Dashboard: stdlib HTTP server uses dynamic BaseHTTPRequestHandler attributes.
[[tool.mypy.overrides]]
module = ["dashboard.*"]
strict = false
disallow_untyped_defs = false
warn_return_any = false

# Scripts (general): relaxed for installer/wrapper scripts.
[[tool.mypy.overrides]]
module = ["scripts.*"]
strict = false
disallow_untyped_defs = false
warn_return_any = false

# MCP tools: FastMCP's @mcp.tool() decorator is untyped in the SDK.
# These modules register tools via that decorator, so we relax the
# untyped-decorator check for them only.
[[tool.mypy.overrides]]
module = [
    "aizee_mcp.tools.workflow_tools",
    "aizee_mcp.tools.policy_tools",
    "aizee_mcp.tools.memory_tools",
    "aizee_mcp.tools.context_tools",
    "aizee_mcp.tools.seo_tools",
    "aizee_mcp.tools.email_tools",
    "aizee_mcp.tools.social_tools",
    "aizee_mcp.tools.ads_tools",
    "aizee_mcp.tools.analytics_tools",
    "aizee_mcp.tools.cro_tools",
    "aizee_mcp.tools.freelance_tools",
    "aizee_mcp.tools.task_tools",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["scripts.generate_manifest", "scripts.guard_invariants"]
strict = false
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
# Thread-based timeout (signal-based does not work on Windows); guards CI
# against hung tests (network, subprocesses) without killing the whole run.
timeout = "300"
timeout_method = "thread"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "unit: marks tests as fast unit tests",
    "fast: marks tests as fast (< 1s, no model loading, no server startup)",
    "mcp: marks tests that spin up the MCP server (slow, ~3s each)",
    "dashboard: marks tests that start the dashboard server (slow)",
    "vector: marks tests that load the SentenceTransformer model (slow)",
]

# Coverage configuration — enforces the floor when running ``pytest --cov``
# directly. ``aizee test --full`` also passes ``--cov-fail-under`` explicitly;
# this section provides the same gate for ad-hoc coverage runs and CI without
# the CLI wrapper. The floor is 100% (branch coverage), matching the enforced
# full-tier gate; do not lower it.
[tool.coverage.run]
source = ["runtime", "memory", "aizee_mcp", "dashboard", "eval"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    # Plugins disabled in plugins.yaml are config-dead code: the kernel never
    # loads them and the sandbox blocks their imports, so they can never accrue
    # coverage. Re-measure a plugin here when it is re-enabled.
    "plugins/upwork/*",
    "plugins/freelancer/*",
    "plugins/fiverr/*",
    "plugins/linkedin/*",
    "plugins/brevo/*",
    "plugins/listmonk/*",
    "plugins/documenso/*",
    "plugins/postiz/*",
    "plugins/twitter/*",
    "plugins/youtube/*",
    "plugins/mostaql/*",
    "plugins/khamsat/*",
    "plugins/google_ads/*",
    "plugins/meta_ads/*",
    "plugins/tiktok_ads/*",
    "plugins/linkedin_ads/*",
    "plugins/posthog/*",
    "plugins/n8n/*",
    "plugins/twenty/*",
    "plugins/hubspot/*",
    "plugins/chatwoot/*",
    "plugins/formbricks/*",
    "plugins/openreplay/*",
    "plugins/growthbook/*",
    "plugins/flagsmith/*",
    "plugins/lago/*",
    "plugins/erpnext/*",
    "plugins/sendgrid/*",
    "plugins/kit/*",
    "plugins/klaviyo/*",
    "plugins/automatisch/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
    "@(abc\\.)?abstractmethod",
]
